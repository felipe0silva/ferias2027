<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Joinville ⇄ Vitória · Guia 3D</title>
<style>
:root{--tx:#1c1c1e;--mut:#6e6e73;--glass:rgba(255,255,255,.78);--sep:rgba(60,60,67,.12);--fill:rgba(118,118,128,.12);--ida:#007AFF;--volta:#AF52DE;--ok:#34C759;--sh:0 10px 30px rgba(0,0,0,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfeaf3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--sh)}
#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));border-radius:18px;padding:10px 16px;z-index:5}
#top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}#top div{font-size:13px;color:var(--mut)}
#chip{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));border-radius:18px;padding:10px 16px;z-index:5;border:0;font:inherit;cursor:pointer;text-align:right;min-height:44px}
#chip b{display:block;font-size:17px;color:var(--ok)}#chip span{font-size:13px;color:var(--mut)}
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;border-radius:99px;padding:6px;z-index:5}
#ctl button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--tx)}
#ctl button.main{background:var(--ida);color:#fff;width:56px;height:56px;font-size:20px}
#ctl button.vw{width:auto;white-space:nowrap;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--fill)}#ctl .lbl{font-size:13px;color:var(--mut);padding:0 8px;min-width:96px;text-align:center}
.pin{position:fixed;left:0;top:0;z-index:3;transform:translate(-50%,-100%);cursor:pointer;border:0;padding:0;background:none}
.pin i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-style:normal;font-weight:700;font-size:15px;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.pin::after{content:"";display:block;width:2px;height:10px;background:#fff;margin:0 auto}
.pin{padding:5px}
.car{position:fixed;left:0;top:0;z-index:2;transform:translate(-50%,-140%);font-size:11px;font-weight:700;background:#111;color:#fff;border-radius:99px;padding:3px 8px;pointer-events:none;white-space:nowrap}
#card{position:fixed;z-index:10;right:max(16px,env(safe-area-inset-right));top:84px;width:380px;max-height:calc(100% - 180px);overflow:auto;border-radius:22px;transform:translateY(20px) scale(.98);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card img.ph{width:100%;height:190px;object-fit:cover;display:block;border-radius:22px 22px 0 0}
.cb{padding:16px 18px 20px}.day{font-size:14px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px}
.n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:14px}
.ttl{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}.hn{font-size:16px;color:var(--mut)}.ls{font-size:14px;color:var(--mut);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}.pill{font-size:14px;font-weight:500;padding:6px 12px;border-radius:99px;background:var(--fill)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:16px;color:var(--mut);padding:8px 0;border-bottom:.5px solid var(--sep)}.row b{color:var(--tx);font-weight:500;text-align:right;white-space:nowrap}
.tot{border:0;padding-top:12px;font-weight:700;color:var(--tx)}.tot b{color:var(--ok);font-weight:700;font-size:18px}
.x{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer}
.lunch{display:flex;gap:12px;align-items:center;background:var(--fill);border-radius:14px;padding:10px;margin:10px 0}.lunch img{width:64px;height:64px;border-radius:12px;object-fit:cover}
@media(max-width:700px){#ctl .lbl{min-width:0;max-width:110px;font-size:12px}#ctl button.vw{padding:0 10px;font-size:12px}#card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72%;border-radius:22px 22px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}#card.on{transform:none}#top h1{font-size:16px}#top div{font-size:11px}#top{padding:8px 12px;max-width:52%}#chip{padding:8px 12px}#chip b{font-size:15px}}
@media(prefers-color-scheme:dark){:root{--tx:#f5f5f7;--mut:#98989f;--glass:rgba(28,28,30,.78);--sep:rgba(84,84,88,.5);--fill:rgba(118,118,128,.24)}}
